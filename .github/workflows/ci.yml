name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kwatt
          POSTGRES_PASSWORD: kwatt
          POSTGRES_DB: kwatt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kwatt" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations sur une base vide
        run: for f in db/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
        env:
          PGHOST: localhost
          PGUSER: kwatt
          PGPASSWORD: kwatt
          PGDATABASE: kwatt
