name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kwatt
          POSTGRES_PASSWORD: kwatt
          POSTGRES_DB: kwatt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kwatt" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Migrations sur une base vide (runner SQL, table schema_migrations)
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://kwatt:kwatt@localhost:5432/kwatt
      - name: Migrations déjà appliquées (second passage sans effet)
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://kwatt:kwatt@localhost:5432/kwatt
      - run: pnpm test
        env:
          # Chaque suite crée puis supprime sa propre base.
          TEST_DATABASE_URL: postgres://kwatt:kwatt@localhost:5432/kwatt

  # L'image de production de l'API se construit (apps/server/Dockerfile, depuis la racine).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image de l'API
        run: docker build -f apps/server/Dockerfile --build-arg KWATT_VERSION=${GITHUB_SHA::7} -t kwatt-api:ci .
