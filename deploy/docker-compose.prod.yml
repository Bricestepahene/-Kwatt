# Kwatt en production sur un VPS (voir docs/DEPLOIEMENT.md).
#
# Toujours lancer par le petit script, depuis la racine du dépôt :
#   ./deploy/compose.sh up -d --build
# (équivaut à : docker compose --env-file .env -f deploy/docker-compose.prod.yml …)
#
# Les chemins relatifs ci-dessous partent du dossier deploy/.
# D-02 : pas de Redis en V1 (un seul processus serveur, parties en mémoire, chaque coup en base).

name: kwatt

services:
  # Entrée HTTPS : certificats Let's Encrypt automatiques pour DOMAIN, proxy vers l'API.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  # API REST + temps réel (@kwatt/server). Jamais exposée directement : Caddy est devant.
  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      args:
        KWATT_VERSION: ${KWATT_VERSION:-dev}
    image: kwatt-api:${KWATT_VERSION:-dev}
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      API_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-kwatt}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@postgres:5432/${POSTGRES_DB:-kwatt}
      PUBLIC_BASE_URL: https://${DOMAIN}
      TRUST_PROXY: "true"
      MEDIA_DIR: /data/media
      LUDO_AI_URL: http://ludo-ai:8090
      # Les migrations s'appliquent à chaque démarrage (verrou consultatif : jamais deux fois en
      # même temps ; une migration déjà appliquée n'est jamais rejouée).
      MIGRATE_ON_START: "true"
    volumes:
      - media:/data/media
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Moteur du Ludo (service séparé, écrit par l'équipe « moteur Ludo »).
  ludo-ai:
    build:
      context: ..
      dockerfile: services/ludo-ai/Dockerfile
    image: kwatt-ludo-ai:${KWATT_VERSION:-dev}
    restart: unless-stopped
    # Pas de .env complet : le moteur n'a besoin d'aucun secret de l'API.
    environment:
      NODE_ENV: production
      LUDO_AI_PORT: "8090"
    expose:
      - "8090"
    logging: *logging

  # PostgreSQL 16 : données dans un volume, jamais exposé sur Internet.
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kwatt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-kwatt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    logging: *logging

  # Sauvegarde quotidienne (pg_dump), gardée BACKUP_KEEP_DAYS jours (14 par défaut).
  # Les fichiers arrivent dans BACKUP_DIR sur le VPS (deploy/backups par défaut).
  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/kwatt-backup"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-kwatt}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      PGDATABASE: ${POSTGRES_DB:-kwatt}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
    volumes:
      - ./backup.sh:/usr/local/bin/kwatt-backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
