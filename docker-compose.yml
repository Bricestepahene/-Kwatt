# Développement local : seulement PostgreSQL 16 (D-02 : pas de Redis en V1).
#
#   docker compose up -d       démarre la base (identifiants : POSTGRES_* de .env)
#   pnpm db:migrate            applique les migrations (table schema_migrations)
#   pnpm --filter @kwatt/server dev
#
# La production a son propre fichier : deploy/docker-compose.prod.yml (docs/DEPLOIEMENT.md).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kwatt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kwatt}
      POSTGRES_DB: ${POSTGRES_DB:-kwatt}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
