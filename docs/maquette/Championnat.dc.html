<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kwatt — Championnat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Unbounded:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1230}
a{color:#F2B705}a:hover{color:#FFD24A}
.obom{background-color:#6E4426;background-image:repeating-linear-gradient(8deg,rgba(0,0,0,.18) 0 2px,transparent 2px 7px),repeating-linear-gradient(-3deg,rgba(255,220,170,.10) 0 1px,transparent 1px 11px)}
.d{font-family:'Unbounded',system-ui,sans-serif}
th{font-size:11px;font-weight:700;color:#A9AECF;text-align:center;padding:8px 2px}
td{font-size:13px;text-align:center;padding:0 2px;height:38px;border-top:1px solid #3D4590}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0F1230;color:#F4EEDF;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div class="obom" style="padding:16px 20px 18px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:12px">
      <a href="Ligues.dc.html" aria-label="Retour" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#0F1230;color:#F4EEDF">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">Dames · Championnat privé</span>
        <h1 class="d" style="margin:0;font-size:18px;font-weight:800">Championnat du Kwatt</h1>
      </div>
    </div>
    <div style="display:flex;gap:6px;font-size:12px">
      <span style="background:#0F1230;padding:6px 10px;border-radius:999px">Journée 7 / 18</span>
      <span style="background:#0F1230;padding:6px 10px;border-radius:999px">Code K7-LIGA</span>
      <span style="background:#0F1230;padding:6px 10px;border-radius:999px;color:#F2B705;font-weight:700">Cagnotte 500</span>
    </div>
  </div>

  <div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:12px">
    <a href="PartieDames.dc.html" style="display:flex;align-items:center;gap:12px;background:#20265A;border-radius:14px;padding:12px 14px;color:#F4EEDF;text-decoration:none;border:1px solid #F2B705">
      <div style="display:flex;flex-direction:column;gap:2px;flex:1">
        <span style="font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#F2B705">Ton prochain match · J8 aller</span>
        <b style="font-size:15px">Toi contre Armand (1er)</b>
        <span style="font-size:12px;color:#A9AECF">Dimanche 18:00 · rappel la veille</span>
      </div>
      <span class="d" style="font-size:11px;font-weight:700;background:#F2B705;color:#0F1230;padding:8px 10px;border-radius:8px">Jouer</span>
    </a>

    <table style="width:100%;border-collapse:collapse;background:#20265A;border-radius:14px;overflow:hidden">
      <thead><tr><th style="width:26px">#</th><th style="text-align:left">Joueur</th><th>J</th><th>V</th><th>N</th><th>D</th><th>Pts</th></tr></thead>
      <tbody>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
          <tr style="{{r.st}}">
            <td><span style="{{r.pos}}">{{r.n}}</span></td>
            <td style="text-align:left;font-weight:700">{{r.name}}</td>
            <td>7</td><td>{{r.v}}</td><td>{{r.d}}</td><td>{{r.l}}</td>
            <td class="d" style="font-weight:700">{{r.pts}}</td>
          </tr>
        </sc-for>
      </tbody>
    </table>
    <div style="display:flex;gap:14px;font-size:12px;color:#A9AECF">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:#F2B705"></span>Champion</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:#3FA7E0"></span>Podium</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:#E0442E"></span>Relégation D2</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = [
      ['Armand', 6, 1, 0], ['Christelle', 5, 1, 1], ['Toi · Brice', 5, 0, 2], ['Mireille', 4, 2, 1], ['Yannick', 3, 2, 2],
      ['Ngono', 3, 1, 3], ['Fotso', 2, 2, 3], ['Ewane', 2, 0, 5], ['Junior', 1, 1, 5], ['Tata Odile', 0, 2, 5]
    ];
    const rows = t.map(([name, v, d, l], i) => {
      const zone = i === 0 ? '#F2B705' : i < 3 ? '#3FA7E0' : i > 7 ? '#E0442E' : 'transparent';
      return { n: i + 1, name, v, d, l, pts: v * 3 + d,
        pos: 'display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:' + zone + ';color:' + (zone === 'transparent' ? '#F4EEDF' : '#0F1230'),
        st: i === 2 ? 'background:#1D2B6E' : '' };
    });
    return { rows };
  }
}
</script>
</body>
</html>
