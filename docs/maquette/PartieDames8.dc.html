<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kwatt — Dames anglaises 8×8</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Unbounded:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1230}
a{color:#F2B705}a:hover{color:#FFD24A}
.obom{background-color:#6E4426;background-image:repeating-linear-gradient(8deg,rgba(0,0,0,.18) 0 2px,transparent 2px 7px),repeating-linear-gradient(-3deg,rgba(255,220,170,.10) 0 1px,transparent 1px 11px)}
.d{font-family:'Unbounded',system-ui,sans-serif}
.act{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-radius:12px;background:#0F1230;color:#F4EEDF;font-size:15px;font-weight:700;border:0;text-decoration:none;font-family:'DM Sans',sans-serif;width:100%;box-sizing:border-box}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0F1230;color:#F4EEDF;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px 0 30px;position:relative;overflow:hidden">

  <div style="display:flex;align-items:center;gap:10px;padding:0 16px;opacity:.75">
    <span class="d" style="width:34px;height:34px;border-radius:50%;background:#14110F;border:2px solid #3A322B;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px">J</span>
    <b style="font-size:15px">Junior</b>
    <span style="font-size:13px;color:#A9AECF">11</span>
    <span class="d" style="margin-left:auto;font-size:22px;font-weight:700;color:#A9AECF;font-variant-numeric:tabular-nums">2:05</span>
  </div>

  <div style="margin:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#20265A;border:1px solid #3D4590;border-radius:10px;padding:7px 12px;font-size:12px"><span style="color:#A9AECF">Ouverture tirée au sort</span><b style="font-family:ui-monospace,Menlo,monospace">11-15 · 23-19 · 8-11</b></div>

  <div style="display:flex;justify-content:center">
    <div role="img" aria-label="Damier anglais 8 par 8. Ton pion sélectionné doit prendre le pion noir vers l'avant." class="obom" style="padding:6px;border-radius:12px">
      <div style="display:grid;grid-template-columns:repeat(8,44px);grid-template-rows:repeat(8,44px)">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="64">
          <div style="{{c.sq}}">
            <sc-if value="{{c.has}}" hint-placeholder-val="{{false}}">
              <span style="{{c.pc}}">
                <sc-if value="{{c.king}}" hint-placeholder-val="{{false}}">
                  <svg width="18" height="18" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 10 L3 4 L5.5 7 L7 3 L8.5 7 L11 4 L12 10 Z" fill="#F2B705"></path></svg>
                </sc-if>
              </span>
            </sc-if>
            <sc-if value="{{c.dot}}" hint-placeholder-val="{{false}}">
              <span style="width:16px;height:16px;border-radius:50%;background:#F2B705;box-shadow:0 0 0 5px rgba(242,183,5,.35)"></span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="text-align:center;font-size:13px;font-weight:700;color:#F2B705;height:18px">Prise obligatoire · un pion ne prend que vers l'avant</div>

  <div style="display:flex;align-items:center;gap:10px;padding:0 16px">
    <span class="d" style="width:40px;height:40px;border-radius:50%;background:#F4EEDF;color:#0F1230;border:3px solid #F2B705;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-sizing:border-box">B</span>
    <div style="display:flex;flex-direction:column;gap:1px"><b style="font-size:15px">À toi</b><span style="font-size:13px;color:#A9AECF">9 pions · 1 dame</span></div>
    <span class="d" style="margin-left:auto;font-size:28px;font-weight:800;color:#F2B705;font-variant-numeric:tabular-nums">2:41</span>
    <button type="button" aria-label="Menu de la partie" aria-expanded="{{menuOpen}}" onClick="{{openMenu}}" style="width:48px;height:48px;border-radius:14px;border:1px solid #3D4590;background:#20265A;color:#F4EEDF;display:flex;align-items:center;justify-content:center;margin-left:6px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
    </button>
  </div>

  <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
    <button type="button" aria-label="Fermer le menu" onClick="{{closeMenu}}" style="position:absolute;inset:0;background:rgba(5,7,22,.7);border:0;padding:0"></button>
    <section aria-label="Menu de la partie" style="position:absolute;left:0;right:0;bottom:0;background:#20265A;border-radius:26px 26px 0 0;padding:14px 18px 30px;display:flex;flex-direction:column;gap:8px">
      <span style="align-self:center;width:44px;height:5px;border-radius:3px;background:#3D4590;margin-bottom:6px"></span>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#A9AECF;padding:0 4px 6px"><span>Dames anglaises 8×8 · coup 19</span><span>Tournoi · 3 min + 2 s</span></div>
      <a href="Regles.dc.html" class="act">Règles du 8×8</a>
      <button type="button" class="act" onClick="{{closeMenu}}">Proposer le nul</button>
      <a href="PleinSoleil.dc.html" class="act">Mode Plein soleil</a>
      <a href="Resultat.dc.html" class="act" style="color:#FF8A75">Abandonner la partie</a>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: false }; }
  renderVals() {
    const black = ['0,1','0,3','0,5','0,7','1,0','1,4','1,6','2,1','2,7','4,3','2,5'];
    const blackKing = ['2,5'];
    const white = ['5,2','5,6','6,1','6,3','6,7','7,0','7,2','7,4','7,6','3,0'];
    const whiteKing = ['3,0'];
    const sel = '5,2', target = '3,4', threat = '4,3';
    const cells = [];
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const k = r + ',' + c, dark = (r + c) % 2 === 1, isB = black.includes(k), isW = white.includes(k);
      let sq = 'display:flex;align-items:center;justify-content:center;background:' + (dark ? '#A8703F' : '#F1E2BF') + ';';
      if (k === target) sq += 'box-shadow:inset 0 0 0 3px #F2B705;';
      let pc = 'width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;';
      if (isW) pc += 'background:#F4EEDF;border:4px solid #C9B98F;box-shadow:0 3px 0 #8C7B55;';
      if (isB) pc += 'background:#14110F;border:4px solid #3A322B;box-shadow:0 3px 0 #000;';
      if (k === sel) pc += 'outline:3px solid #F2B705;outline-offset:1px;';
      if (k === threat) pc += 'outline:2px dashed #FF8A75;outline-offset:1px;';
      cells.push({ sq, pc, has: isB || isW, king: blackKing.includes(k) || whiteKing.includes(k), dot: k === target });
    }
    return { cells, open: this.state.open, menuOpen: String(this.state.open),
      openMenu: () => this.setState({ open: true }), closeMenu: () => this.setState({ open: false }) };
  }
}
</script>
</body>
</html>
