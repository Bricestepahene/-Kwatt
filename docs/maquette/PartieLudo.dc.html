<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kwatt — Partie de Ludo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Unbounded:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1230}
a{color:#F2B705}a:hover{color:#FFD24A}
.kaba{background-image:repeating-linear-gradient(90deg,#E0442E 0 10px,#F2B705 10px 16px,#1F9D6B 16px 26px,#F4EEDF 26px 29px,#3FA7E0 29px 38px)}
.d{font-family:'Unbounded',system-ui,sans-serif}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0F1230;color:#F4EEDF;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div class="kaba" style="height:8px;flex-shrink:0"></div>
  <div style="height:40px"></div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 15px 10px">
    <div style="display:flex;align-items:center;gap:8px;background:#20265A;border-radius:12px;padding:8px 10px;border:2px solid #E0442E"><span style="width:12px;height:12px;border-radius:50%;background:#E0442E"></span><b style="font-size:13px">Toi</b><span style="margin-left:auto;font-size:12px;color:#F2B705;font-weight:700">{{myTag}}</span></div>
    <div style="display:flex;align-items:center;gap:8px;background:#20265A;border-radius:12px;padding:8px 10px"><span style="width:12px;height:12px;border-radius:50%;background:#1F9D6B"></span><b style="font-size:13px">Christelle</b><span style="margin-left:auto;font-size:12px;color:#A9AECF">{{cTag}}</span></div>
  </div>

  <div style="display:flex;justify-content:center">
    <div role="img" aria-label="Plateau de Ludo à quatre joueurs : rouge, vert, jaune, bleu" style="position:relative;width:360px;height:360px;border-radius:10px;overflow:hidden;background:#F4EEDF">
      <div style="display:grid;grid-template-columns:repeat(15,24px);grid-template-rows:repeat(15,24px)">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="225">
          <div style="{{c.st}}">{{c.star}}</div>
        </sc-for>
      </div>
      <sc-for list="{{homes}}" as="h" hint-placeholder-count="4">
        <div style="{{h.st}}">
          <div style="width:96px;height:96px;border-radius:14px;background:#F4EEDF;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));place-items:center;padding:10px;box-sizing:border-box">
            <sc-for list="{{h.slots}}" as="s" hint-placeholder-count="4">
              <span style="{{s}}"></span>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true" style="position:absolute;left:144px;top:144px">
        <path d="M0 0 L36 36 L0 72 Z" fill="#E0442E"></path>
        <path d="M0 0 L72 0 L36 36 Z" fill="#1F9D6B"></path>
        <path d="M72 0 L72 72 L36 36 Z" fill="#F2B705"></path>
        <path d="M0 72 L72 72 L36 36 Z" fill="#3FA7E0"></path>
      </svg>
      <sc-for list="{{tokens}}" as="t" hint-placeholder-count="6">
        <span style="{{t}}"></span>
      </sc-for>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 15px 0">
    <div style="display:flex;align-items:center;gap:8px;background:#20265A;border-radius:12px;padding:8px 10px;{{jRing}}"><span style="width:12px;height:12px;border-radius:50%;background:#3FA7E0"></span><b style="font-size:13px">Junior</b><span style="margin-left:auto;font-size:11px;font-weight:700;color:{{jColor}}">{{jTag}}</span></div>
    <div style="display:flex;align-items:center;gap:8px;background:#20265A;border-radius:12px;padding:8px 10px;{{pRing}}"><span style="width:12px;height:12px;border-radius:50%;background:#F2B705"></span><b style="font-size:13px">Tonton Paul</b><span style="margin-left:auto;font-size:11px;font-weight:700;color:#F4EEDF">{{pTag}}</span></div>
  </div>

  <div style="margin-top:auto;padding:14px 16px 28px;display:flex;align-items:center;gap:14px">
    <div role="img" aria-label="Dé : 6" style="width:72px;height:72px;border-radius:16px;background:#F4EEDF;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));padding:12px 16px;box-sizing:border-box;place-items:center;box-shadow:0 4px 0 #C9B98F;flex-shrink:0">
      <span style="width:11px;height:11px;border-radius:50%;background:#E0442E"></span><span style="width:11px;height:11px;border-radius:50%;background:#E0442E"></span>
      <span style="width:11px;height:11px;border-radius:50%;background:#E0442E"></span><span style="width:11px;height:11px;border-radius:50%;background:#E0442E"></span>
      <span style="width:11px;height:11px;border-radius:50%;background:#E0442E"></span><span style="width:11px;height:11px;border-radius:50%;background:#E0442E"></span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;flex:1">
      <span style="font-size:14px;display:flex;align-items:center;gap:8px"><span class="d" aria-label="Temps restant pour jouer" style="width:34px;height:34px;flex-shrink:0;border-radius:50%;border:3px solid {{tColor}};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">{{t}}</span><span><b>{{msgB}}</b> {{msg}}</span></span>
      <div style="display:flex;gap:8px">
        <a href="Resultat.dc.html" class="d" style="flex:1;height:48px;border-radius:12px;background:#F2B705;color:#0F1230;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">Sortir un pion</a>
        <a href="Salon.dc.html" aria-label="Menu de la partie : nul, son, quitter" style="width:48px;height:48px;border-radius:12px;border:1px solid #3D4590;background:#20265A;color:#F4EEDF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat":{"editor":"enum","options":["normal","coup unique","joueur absent","équipe"],"default":"normal"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const R = '#E0442E', G = '#1F9D6B', Y = '#F2B705', B = '#3FA7E0';
    const SH = { [R]: 'border-radius:50%', [G]: 'border-radius:4px', [Y]: 'border-radius:3px;transform:rotate(45deg) scale(.86)', [B]: 'border-radius:50% 50% 3px 3px' };
    const cells = [];
    for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) {
      const corner = (r < 6 || r > 8) && (c < 6 || c > 8);
      const center = r >= 6 && r <= 8 && c >= 6 && c <= 8;
      let bg = '#F4EEDF', star = '';
      if (r === 7 && c >= 1 && c <= 5) bg = R;
      if (c === 7 && r >= 1 && r <= 5) bg = G;
      if (r === 7 && c >= 9 && c <= 13) bg = Y;
      if (c === 7 && r >= 9 && r <= 13) bg = B;
      if (r === 6 && c === 1) bg = R;
      if (r === 1 && c === 8) bg = G;
      if (r === 8 && c === 13) bg = Y;
      if (r === 13 && c === 6) bg = B;
      if ((r === 8 && c === 2) || (r === 2 && c === 6) || (r === 6 && c === 12) || (r === 12 && c === 8)) star = '★';
      const st = (corner || center)
        ? 'background:transparent'
        : 'background:' + bg + ';box-shadow:inset 0 0 0 0.5px #B9B09A;display:flex;align-items:center;justify-content:center;font-size:13px;color:#8C7B55';
      cells.push({ st, star });
    }
    const slot = (col, filled) => filled
      ? 'width:28px;height:28px;' + SH[col] + ';background:' + col + ';box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), 0 0 0 3px #F4EEDF, 0 0 0 4px ' + col
      : 'width:28px;height:28px;border-radius:50%;border:2px dashed ' + col + ';box-sizing:border-box';
    const home = (x, y, col, n) => ({
      st: 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:144px;height:144px;background:' + col + ';display:flex;align-items:center;justify-content:center',
      slots: [0, 1, 2, 3].map((i) => slot(col, i < n))
    });
    const homes = [home(0, 0, R, 2), home(216, 0, G, 2), home(216, 216, Y, 3), home(0, 216, B, 2)];
    const tok = (r, c, col, ring) => 'position:absolute;left:' + (c * 24 + 3) + 'px;top:' + (r * 24 + 3) + 'px;width:18px;height:18px;' + SH[col] + ';background:' + col + ';box-sizing:border-box;border:2px solid ' + (col === Y ? '#0F1230' : '#F4EEDF') + ';box-shadow:0 2px 0 rgba(0,0,0,.35)' + (ring ? ',0 0 0 3px #0F1230' : '');
    const tokens = [tok(6, 4, R, true), tok(12, 8, R, true), tok(8, 11, G), tok(6, 9, Y), tok(10, 6, B), tok(4, 8, B)];
    const e = this.props.etat ?? 'normal';
    const S = {
      normal: { msgB: 'Un 6.', msg: 'Touche le pion à jouer.', t: '12 s', tColor: '#F2B705' },
      'coup unique': { msgB: 'Un 3.', msg: 'Un seul coup possible : joué pour toi.', t: 'auto', tColor: '#5FD3A2' },
      'joueur absent': { msgB: 'Junior ne répond plus.', msg: 'La machine joue pour lui, 1 tour sur 3.', t: '12 s', tColor: '#F2B705' },
      'équipe': { msgB: 'Un 6.', msg: 'Paul est ton partenaire : ses pions ne peuvent pas être mangés par toi.', t: '12 s', tColor: '#F2B705' }
    }[e];
    const team = e === 'équipe', away = e === 'joueur absent';
    return { cells, homes, tokens, ...S, myTag: team ? 'à toi · équipe' : 'à toi', cTag: team ? 'équipe adverse' : '1 rentré',
      jTag: away ? 'machine · 1/3' : (team ? 'équipe adverse' : ''), jColor: away ? '#F2B705' : '#A9AECF', jRing: away ? 'border:2px dashed #F2B705' : '',
      pTag: team ? 'partenaire' : '', pRing: team ? 'border:2px solid #E0442E' : '' };
  }
}
</script>
</body>
</html>
