<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kwatt — Ludo à 6 joueurs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Unbounded:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1230}
a{color:#F2B705}a:hover{color:#FFD24A}
.kaba{background-image:repeating-linear-gradient(90deg,#E0442E 0 10px,#F2B705 10px 16px,#1F9D6B 16px 26px,#F4EEDF 26px 29px,#3FA7E0 29px 38px)}
.d{font-family:'Unbounded',system-ui,sans-serif}
.pl{display:flex;align-items:center;gap:6px;background:#20265A;border:1px solid #3D4590;border-radius:10px;padding:6px 8px;font-size:12px;font-weight:700;min-width:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0F1230;color:#F4EEDF;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div class="kaba" style="height:8px;flex-shrink:0"></div>
  <div style="height:28px"></div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 15px 10px">
    <sc-for list="{{top}}" as="p" hint-placeholder-count="3">
      <div class="pl" style="{{p.ring}}"><span style="{{p.dot}}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{p.name}}</span></div>
    </sc-for>
  </div>

  <div style="display:flex;justify-content:center">
    <div role="img" aria-label="Plateau de Ludo en étoile à 6 branches, 6 couleurs" style="position:relative;width:360px;height:360px;border-radius:50%;background:#14173A">
      <sc-for list="{{bases}}" as="b" hint-placeholder-count="6">
        <div style="{{b.st}}">
          <sc-for list="{{b.slots}}" as="s" hint-placeholder-count="4"><span style="{{s}}"></span></sc-for>
        </div>
      </sc-for>
      <sc-for list="{{arms}}" as="a" hint-placeholder-count="6">
        <div style="{{a.st}}">
          <sc-for list="{{a.cells}}" as="c" hint-placeholder-count="18">
            <div style="{{c.st}}">{{c.star}}<sc-if value="{{c.tok}}" hint-placeholder-val="{{false}}"><span style="{{c.tst}}"></span></sc-if></div>
          </sc-for>
        </div>
      </sc-for>
      <div style="{{hex}}"></div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px 15px 0">
    <sc-for list="{{bottom}}" as="p" hint-placeholder-count="3">
      <div class="pl" style="{{p.ring}}"><span style="{{p.dot}}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{p.name}}</span></div>
    </sc-for>
  </div>

  <div style="margin-top:auto;padding:14px 16px 28px;display:flex;align-items:center;gap:14px">
    <div role="img" aria-label="Dé : 4" style="width:72px;height:72px;border-radius:16px;background:#F4EEDF;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));padding:16px;box-sizing:border-box;place-items:center;box-shadow:0 4px 0 #C9B98F;flex-shrink:0">
      <span style="width:12px;height:12px;border-radius:50%;background:#E0442E"></span><span style="width:12px;height:12px;border-radius:50%;background:#E0442E"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#E0442E"></span><span style="width:12px;height:12px;border-radius:50%;background:#E0442E"></span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;flex:1">
      <span style="font-size:14px"><b>Un 4.</b> Touche le pion à jouer.</span>
      <div style="display:flex;gap:8px">
        <a href="Resultat.dc.html" class="d" style="flex:1;height:48px;border-radius:12px;background:#F2B705;color:#0F1230;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">Avancer</a>
        <a href="LudoVariantes.dc.html" aria-label="Menu de la partie : règles, nul, quitter" style="width:48px;height:48px;border-radius:12px;border:1px solid #3D4590;background:#20265A;color:#F4EEDF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = ['#E0442E', '#1F9D6B', '#F2B705', '#3FA7E0', '#9B6AE0', '#F08A24'];
    const SH = ['border-radius:50%', 'border-radius:3px', 'border-radius:2px;transform:rotate(45deg) scale(.85)', 'border-radius:50% 50% 2px 2px',
      'clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)', 'clip-path:polygon(50% 0,100% 100%,0 100%)'];
    const tokAt = { '0,4,0': 0, '1,2,2': 1, '2,0,1': 3, '3,3,0': 3, '4,1,2': 4, '5,5,0': 5, '2,4,2': 2 };
    const arms = [0, 1, 2, 3, 4, 5].map((k) => {
      const cells = [];
      for (let row = 0; row < 6; row++) for (let col = 0; col < 3; col++) {
        let bg = '#F4EEDF';
        if (col === 1 && row >= 1) bg = C[k];
        if (col === 2 && row === 1) bg = C[k];
        const t = tokAt[k + ',' + row + ',' + col];
        cells.push({ star: col === 0 && row === 3 ? '★' : '', tok: t !== undefined,
          st: 'background:' + bg + ';box-shadow:inset 0 0 0 0.5px #B9B09A;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8C7B55',
          tst: t === undefined ? '' : 'width:14px;height:14px;box-sizing:border-box;background:' + C[t] + ';border:2px solid ' + (t === 2 ? '#0F1230' : '#F4EEDF') + ';' + SH[t] });
      }
      return { cells, st: 'position:absolute;left:150px;top:8px;width:60px;height:120px;transform-origin:30px 172px;transform:rotate(' + (k * 60) + 'deg);display:grid;grid-template-columns:repeat(3,20px);grid-template-rows:repeat(6,20px)' };
    });
    const home = [3, 2, 4, 3, 2, 4];
    const bases = [0, 1, 2, 3, 4, 5].map((k) => {
      const a = (k * 60 + 30) * Math.PI / 180, x = 180 + 140 * Math.sin(a) - 30, y = 180 - 140 * Math.cos(a) - 30;
      return { st: 'position:absolute;left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;width:60px;height:60px;border-radius:50%;background:' + C[k] + ';display:grid;grid-template-columns:repeat(2,14px);gap:6px;place-content:center',
        slots: [0, 1, 2, 3].map((i) => 'width:14px;height:14px;box-sizing:border-box;' + SH[k] + ';' + (i < home[k] ? 'background:#F4EEDF' : 'border:2px dashed #F4EEDF')) };
    });
    const hex = 'position:absolute;left:120px;top:128px;width:120px;height:104px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:conic-gradient(from -30deg,' + C.map((c, i) => c + ' ' + (i * 60) + 'deg ' + (i * 60 + 60) + 'deg').join(',') + ')';
    const P = [['Toi', 0, true], ['Christelle', 1], ['Paul', 2], ['Junior', 3], ['Odile', 4], ['Armand', 5]];
    const pl = P.map(([name, i, me]) => ({ name, dot: 'width:12px;height:12px;flex-shrink:0;box-sizing:border-box;background:' + C[i] + ';' + SH[i], ring: me ? 'border:2px solid #F4EEDF' : '' }));
    return { arms, bases, hex, top: pl.slice(0, 3), bottom: pl.slice(3) };
  }
}
</script>
</body>
</html>
