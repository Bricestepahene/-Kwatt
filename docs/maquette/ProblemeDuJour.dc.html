<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kwatt — Problème du jour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Unbounded:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1230}
a{color:#F2B705}a:hover{color:#FFD24A}
.obom{background-color:#6E4426;background-image:repeating-linear-gradient(8deg,rgba(0,0,0,.18) 0 2px,transparent 2px 7px),repeating-linear-gradient(-3deg,rgba(255,220,170,.10) 0 1px,transparent 1px 11px)}
.d{font-family:'Unbounded',system-ui,sans-serif}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0F1230;color:#F4EEDF;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div class="obom" style="height:8px"></div>
  <div style="padding:12px 16px;display:flex;align-items:center;gap:10px">
    <a href="ModeDames.dc.html" aria-label="Retour" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#20265A;color:#F4EEDF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display:flex;flex-direction:column;gap:1px"><b style="font-size:15px">Problème du jour · 10×10</b><span style="font-size:12px;color:#A9AECF">Série : 6 jours · +10 cauris si tu trouves</span></div>
  </div>

  <div style="margin:0 16px 12px;background:#20265A;border:1px solid #3D4590;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45"><b>Les blancs jouent.</b> Deux pions peuvent prendre. Lequel dois-tu jouer ?</div>

  <div style="display:flex;justify-content:center">
    <div role="img" aria-label="{{alt}}" class="obom" style="padding:5px;border-radius:10px">
      <div style="display:grid;grid-template-columns:repeat(10,34px);grid-template-rows:repeat(10,34px)">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="100">
          <div style="{{c.sq}}">
            <sc-if value="{{c.num}}" hint-placeholder-val="{{false}}"><span style="position:absolute;left:2px;top:1px;font-size:9px;font-weight:700;color:rgba(255,255,255,.8)">{{c.num}}</span></sc-if>
            <sc-if value="{{c.has}}" hint-placeholder-val="{{false}}"><span style="{{c.pc}}"></span></sc-if>
            <sc-if value="{{c.dot}}" hint-placeholder-val="{{false}}"><span style="width:12px;height:12px;border-radius:50%;background:#F2B705;box-shadow:0 0 0 4px rgba(242,183,5,.35)"></span></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="padding:14px 16px 26px;display:flex;flex-direction:column;gap:10px;flex:1">
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
        <button type="button" onClick="{{o.pick}}" style="{{o.st}}">{{o.label}}</button>
      </sc-for>
    </div>
    <sc-if value="{{answered}}" hint-placeholder-val="{{false}}">
      <div style="{{fbSt}}"><b>{{fbTitle}}</b> {{fb}}</div>
    </sc-if>
    <div style="margin-top:auto;display:flex;justify-content:space-between;font-size:12px;color:#A9AECF"><span>48 % de Bonamoussadi ont trouvé</span><span>Demain : un coup de dame</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: null }; }
  renderVals() {
    const p = this.state.pick;
    const black = ['5,4', '3,4', '1,4', '5,8', '0,1', '2,7'];
    const white = ['6,3', '6,9', '7,2', '8,5'];
    const path = { 32: ['4,5', '2,3', '0,5'], 35: ['4,7'] }[p] || [];
    const taken = { 32: ['5,4', '3,4', '1,4'], 35: ['5,8'] }[p] || [];
    const cells = [];
    for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) {
      const k = r + ',' + c, dark = (r + c) % 2 === 1, isB = black.includes(k), isW = white.includes(k);
      let pc = 'width:27px;height:27px;border-radius:50%;box-sizing:border-box;';
      if (isW) pc += 'background:#F4EEDF;border:3px solid #C9B98F;box-shadow:0 2px 0 #8C7B55;';
      if (isB) pc += 'background:#14110F;border:3px solid #3A322B;box-shadow:0 2px 0 #000;' + (taken.includes(k) ? 'opacity:.35;' : '');
      if ((p === 32 && k === '6,3') || (p === 35 && k === '6,9')) pc += 'outline:3px solid #F2B705;outline-offset:1px;';
      cells.push({ sq: 'position:relative;display:flex;align-items:center;justify-content:center;background:' + (dark ? '#A8703F' : '#F1E2BF'),
        pc, has: isB || isW, dot: path.includes(k), num: dark ? String(r * 5 + Math.floor(c / 2) + 1) : '' });
    }
    const opts = [[32, 'Le pion 32'], [35, 'Le pion 35']].map(([id, label]) => ({ label, pick: () => this.setState({ pick: id }),
      st: 'height:52px;border-radius:12px;font-family:Unbounded,sans-serif;font-size:13px;font-weight:700;color:#F4EEDF;background:#20265A;' + (p === id ? 'border:2px solid #F4EEDF' : 'border:1px solid #3D4590') }));
    const good = p === 32;
    return { cells, opts, answered: p !== null, alt: 'Problème : les blancs jouent, deux prises possibles',
      fbTitle: good ? 'Bravo, +10 cauris.' : 'Pas autorisé.',
      fb: good ? '32x3 prend 28, 18 et 8, et ton pion arrive dame. C’est la prise majoritaire : on doit toujours prendre le plus de pions.' : '35x24 ne prend qu’un pion alors qu’une rafle de trois existe. La prise majoritaire t’oblige à jouer 32x3.',
      fbSt: 'border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;' + (good ? 'background:#14382E' : 'background:#2A1820') };
  }
}
</script>
</body>
</html>
