<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kwatt — Revoir une partie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Unbounded:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1230}
a{color:#F2B705}a:hover{color:#FFD24A}
.obom{background-color:#6E4426;background-image:repeating-linear-gradient(8deg,rgba(0,0,0,.18) 0 2px,transparent 2px 7px),repeating-linear-gradient(-3deg,rgba(255,220,170,.10) 0 1px,transparent 1px 11px)}
.d{font-family:'Unbounded',system-ui,sans-serif}
.ctl{width:56px;height:52px;border-radius:14px;border:1px solid #3D4590;background:#20265A;color:#F4EEDF;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0F1230;color:#F4EEDF;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div class="obom" style="height:8px"></div>
  <div style="padding:12px 16px;display:flex;align-items:center;gap:10px">
    <a href="Resultat.dc.html" aria-label="Retour" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#20265A;color:#F4EEDF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display:flex;flex-direction:column;gap:1px"><b style="font-size:15px">Toi contre Mireille</b><span style="font-size:12px;color:#A9AECF">Dames · victoire en 46 coups</span></div>
  </div>

  <div style="display:flex;justify-content:center">
    <div role="img" aria-label="{{alt}}" class="obom" style="padding:5px;border-radius:10px">
      <div style="display:grid;grid-template-columns:repeat(10,34px);grid-template-rows:repeat(10,34px)">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="100">
          <div style="{{c.sq}}"><sc-if value="{{c.has}}" hint-placeholder-val="{{false}}"><span style="{{c.pc}}"></span></sc-if></div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><b class="d" style="font-size:16px">Coup {{move}}</b><span style="font-size:13px;color:#A9AECF">{{caption}}</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;background:#20265A;border:1px solid #3D4590;border-radius:10px;padding:8px 12px"><span style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A9AECF">Notation officielle</span><b style="font-family:ui-monospace,Menlo,monospace;font-size:14px">{{nota}}</b></div>
    <div style="height:8px;border-radius:4px;background:#3D4590;position:relative">
      <div style="height:100%;border-radius:4px;background:#F4EEDF;width:{{pct}}"></div>
      <span style="position:absolute;left:47%;top:-4px;width:4px;height:16px;border-radius:2px;background:#FF8A75"></span>
      <span style="position:absolute;left:67%;top:-4px;width:4px;height:16px;border-radius:2px;background:#5FD3A2"></span>
    </div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button type="button" class="ctl" aria-label="Coup précédent" onClick="{{prev}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <button type="button" class="ctl" aria-label="Coup suivant" onClick="{{next}}" style="width:120px;background:#F4EEDF;color:#0F1230;border:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
    </div>
    <div style="font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A9AECF">Moments clés</div>
    <div style="display:flex;gap:8px">
      <button type="button" onClick="{{goErr}}" style="flex:1;min-height:52px;border-radius:12px;border:1px solid #3D4590;background:#20265A;color:#F4EEDF;font-size:13px;text-align:left;padding:8px 10px;display:flex;flex-direction:column;gap:2px"><b style="color:#FF8A75">Coup 22</b><span>Ton pion laissé en prise</span></button>
      <button type="button" onClick="{{goWin}}" style="flex:1;min-height:52px;border-radius:12px;border:1px solid #3D4590;background:#20265A;color:#F4EEDF;font-size:13px;text-align:left;padding:8px 10px;display:flex;flex-direction:column;gap:2px"><b style="color:#5FD3A2">Coup 31</b><span>Ta rafle de 3 pions</span></button>
    </div>
    <button type="button" class="d" style="height:50px;border:0;border-radius:14px;background:#F2B705;color:#0F1230;font-size:13px;font-weight:700">Partager cette partie</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 1 }; }
  renderVals() {
    const P = [
      { move: 22, nota: '22. 37-31 · 19-23', caption: 'erreur : ton pion de la case 32 est en prise', b: ['0,1','0,3','0,5','0,9','1,0','1,2','1,6','1,8','2,3','2,5','3,2','3,4','3,8','5,2','2,9'], w: ['6,1','6,3','6,5','6,7','7,0','7,4','7,8','8,1','8,3','8,5','8,9','9,0','9,2','9,6','5,4','4,5'] },
      { move: 31, nota: '31. 33-28 · 18-22', caption: 'avant la rafle', b: ['0,1','0,3','0,5','0,9','1,0','1,2','1,6','1,8','2,3','2,5','3,2','3,4','3,8','4,5','2,9'], w: ['5,4','6,1','6,3','6,5','6,7','7,0','7,4','7,8','8,1','8,3','8,5','8,9','9,0','9,2','9,6'] },
      { move: 32, nota: '32. 28x8 · rafle de 3', caption: 'rafle : 3 pions noirs pris', b: ['0,1','0,3','0,5','0,9','1,0','1,2','1,6','1,8','3,2','3,8','2,9'], w: ['1,4','6,1','6,3','6,5','6,7','7,0','7,4','7,8','8,1','8,3','8,5','8,9','9,0','9,2','9,6'] }
    ];
    const i = this.state.i, p = P[i];
    const cells = [];
    for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) {
      const k = r + ',' + c, dark = (r + c) % 2 === 1, isB = p.b.includes(k), isW = p.w.includes(k);
      let pc = 'width:27px;height:27px;border-radius:50%;box-sizing:border-box;';
      if (isW) pc += 'background:#F4EEDF;border:3px solid #C9B98F;';
      if (isB) pc += 'background:#14110F;border:3px solid #3A322B;';
      cells.push({ sq: 'display:flex;align-items:center;justify-content:center;background:' + (dark ? '#A8703F' : '#F1E2BF'), pc, has: isB || isW });
    }
    return { cells, move: p.move, caption: p.caption, nota: p.nota, alt: 'Position au coup ' + p.move, pct: Math.round(p.move / 46 * 100) + '%',
      prev: () => this.setState({ i: Math.max(0, i - 1) }), next: () => this.setState({ i: Math.min(2, i + 1) }),
      goErr: () => this.setState({ i: 0 }), goWin: () => this.setState({ i: 1 }) };
  }
}
</script>
</body>
</html>
